<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catat Siswa Terlambat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #333; margin-top: 0; margin-bottom: 25px;}
        label { font-size: 14px; color: #555; font-weight: 600;}
        select, input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px 0;
            border: 2px solid #eee;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }
        select:focus, input:focus { border-color: #fda085; outline: none; }
        button {
            width: 100%;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:active { opacity: 0.8; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #loadingText { text-align: center; color: #ff7e5f; font-size: 14px; margin-bottom: 15px; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pencatatan Keterlambatan</h2>
    <div id="loadingText">Sedang mengambil data siswa...</div>
    
    <form id="formTerlambat" style="display: none;">
        <label for="kelas">Pilih Kelas</label>
        <select name="kelas" id="kelas" required>
            <option value="">-- Pilih Kelas --</option>
        </select>

        <label for="nama">Ketik / Pilih Nama Siswa</label>
        <!-- Kolom pencarian nama dengan datalist -->
        <input type="text" name="nama" id="inputNama" list="daftarNama" placeholder="Ketik nama siswa..." required disabled autocomplete="off">
        <datalist id="daftarNama"></datalist>

        <label for="alasan">Alasan Terlambat</label>
        <input type="text" name="alasan" id="alasan" placeholder="Contoh: Ban bocor, Bangun kesiangan" required>
        
        <button type="submit" id="btnSubmit">Simpan Data</button>
    </form>
</div>

<script>
    // MASUKKAN URL WEB APP APPS SCRIPT ANDA DI SINI
    const scriptURL = 'https://script.google.com/macros/library/d/1-skL2aqucMeJxkCfbWimCqZnTB7ylTlWDLHqXiy0TnZv33fsi1OTAzcX/7'; 
    
    const form = document.getElementById('formTerlambat');
    const loadingText = document.getElementById('loadingText');
    const selectKelas = document.getElementById('kelas');
    const inputNama = document.getElementById('inputNama');
    const dataListNama = document.getElementById('daftarNama');
    const btnSubmit = document.getElementById('btnSubmit');

    let dataSiswaMentah = [];
    let namaSudahTelatHariIni = [];

    // Mengambil tanggal hari ini format lokal (YYYY-MM-DD)
    const skrg = new Date();
    const hariIniStr = skrg.toLocaleDateString('id-ID');

    // 1. Ambil data Master Siswa & Data Rekap secara bersamaan
    Promise.all([
        fetch(scriptURL).then(res => res.json()),
        fetch(scriptURL + '?action=rekap').then(res => res.json())
    ])
    .then(([dataSiswa, dataRekap]) => {
        dataSiswaMentah = dataSiswa;
        
        // Filter nama-nama siswa yang sudah dicatat pada HARI INI
        namaSudahTelatHariIni = dataRekap
            .filter(item => {
                if (!item.waktu) return false;
                const tglRekap = new Date(item.waktu).toLocaleDateString('id-ID');
                return tglRekap === hariIniStr;
            })
            .map(item => item.nama.toLowerCase().trim());

        // Isi pilihan kelas (A-Z)
        const kelasUnik = [...new Set(dataSiswa.map(item => item.kelas.trim()))];
        selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
        kelasUnik.sort().forEach(kelas => {
            let option = document.createElement('option');
            option.value = kelas;
            option.textContent = kelas;
            selectKelas.appendChild(option);
        });

        muatDaftarNama(dataSiswaMentah);

        inputNama.disabled = false;
        loadingText.style.display = 'none';
        form.style.display = 'block';
    })
    .catch(error => {
        loadingText.textContent = 'Gagal memuat data. Periksa koneksi internet.';
        console.error(error);
    });

    function muatDaftarNama(daftarSiswa) {
        dataListNama.innerHTML = '';
        daftarSiswa.sort((a, b) => a.nama.localeCompare(b.nama)).forEach(siswa => {
            let option = document.createElement('option');
            option.value = siswa.nama;
            dataListNama.appendChild(option);
        });
    }

    // Filter Nama berdasarkan Kelas
    selectKelas.addEventListener('change', function() {
        const kelasPilihan = this.value;
        if (kelasPilihan) {
            const siswaFiltered = dataSiswaMentah.filter(item => item.kelas === kelasPilihan);
            muatDaftarNama(siswaFiltered);
        } else {
            muatDaftarNama(dataSiswaMentah);
        }
        cekDuplikat();
    });

    // Otomatis isi Kelas & Cek Duplikat saat Nama diketik
    inputNama.addEventListener('input', function() {
        const namaKetik = this.value.trim();
        const siswaDitemukan = dataSiswaMentah.find(item => item.nama.toLowerCase() === namaKetik.toLowerCase());
        
        if (siswaDitemukan) {
            selectKelas.value = siswaDitemukan.kelas;
        }
        cekDuplikat();
    });

    // Fungsi Validasi 1x Input per Hari
    function cekDuplikat() {
        const namaKetik = inputNama.value.trim().toLowerCase();
        
        if (namaKetik !== '' && namaSudahTelatHariIni.includes(namaKetik)) {
            btnSubmit.disabled = true;
            btnSubmit.textContent = '❌ Siswa Sudah Dicatat Hari Ini';
            btnSubmit.style.backgroundColor = '#dc3545'; // Warna merah
            btnSubmit.style.cursor = 'not-allowed';
        } else {
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Simpan Data';
            btnSubmit.style.backgroundColor = ''; // Kembalikan ke warna asli
            btnSubmit.style.cursor = 'pointer';
        }
    }

    // Simpan Data
    form.addEventListener('submit', e => {
        e.preventDefault();
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Menyimpan...';

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                alert('Data berhasil disimpan!');
                
                // Tambahkan nama ke daftar hari ini agar tidak bisa diisi 2x tanpa perlu reload
                namaSudahTelatHariIni.push(inputNama.value.trim().toLowerCase());
                
                form.reset();
                muatDaftarNama(dataSiswaMentah);
                cekDuplikat();
            })
            .catch(error => {
                alert('Terjadi kesalahan saat menyimpan!');
                cekDuplikat();
            });
    });
</script>
</body>
</html>
